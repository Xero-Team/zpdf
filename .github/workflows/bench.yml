name: GPU native crash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan and debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
          dpkg-query -W mesa-vulkan-drivers libllvm20 libllvm21 2>/dev/null || true
      - name: Build the two failing suites
        run: |
          cargo test -p zpdf-render-wgpu --test blend --no-run --message-format=json > blend.json
          cargo test -p zpdf --features gpu-render --test gpu_softmask --no-run --message-format=json > softmask.json
      - name: Fixed serial and parallel comparisons with native backtraces
        shell: bash
        run: |
          set -euo pipefail
          for suite in blend softmask; do
            binary=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' "$suite.json" | tail -1)
            test -x "$binary"
            sha256sum "$binary"
            for threads in 1 4; do
              trials=5
              if [ "$threads" = 4 ]; then trials=25; fi
              for trial in $(seq 1 "$trials"); do
                log="${suite}-${threads}-${trial}.log"
                set +e
                timeout 120 gdb -q -batch -ex 'set pagination off' -ex run -ex bt -ex 'thread apply all bt 15' --args "$binary" --nocapture --test-threads="$threads" > "$log" 2>&1
                status=$?
                set -e
                if grep -q 'received signal' "$log"; then
                  echo "DIAG $suite threads=$threads trial=$trial CRASH"
                  sed -n '/received signal/,$p' "$log" | head -220 || true
                elif grep -q 'test result: ok' "$log" && ! grep -q 'skipping GPU' "$log"; then
                  echo "DIAG $suite threads=$threads trial=$trial PASS"
                else
                  echo "DIAG $suite threads=$threads trial=$trial ERROR exit=$status"
                  tail -60 "$log"
                fi
              done
            done
          done
