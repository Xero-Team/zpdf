[package]
name = "zpdf-parser"
description = "PDF file parser: lexer, objects, xref, trailer, stream filters"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zpdf-core.workspace = true
winnow.workspace = true
miniz_oxide.workspace = true
zune-jpeg.workspace = true
tracing.workspace = true
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
getrandom = "0.2"

# getrandom 0.2 has no entropy source on bare wasm32 unless its `js` backend
# (crypto.getRandomValues) is enabled; without this, a wasm consumer of this
# crate alone would not compile.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Reference zlib/deflate encoder for the FlateDecode tests.
flate2.workspace = true
# Pure-Rust LZW codec (the backend used by the `tiff`/`gif` crates). Used ONLY
# in tests as an independent, spec-conformant reference encoder so the LZW
# decoder is validated against an external producer, not its own paired encoder.
weezl = "0.2"
# Pure-Rust JBIG2 decoder (Apache-2.0 OR MIT, #![forbid(unsafe_code)]) from
# the hayro PDF renderer family. Used ONLY in tests as an independent
# differential oracle so zpdf retains its ParseLimits budgets and per-region
# failure isolation while catching decoding divergences early (#173).
hayro-jbig2 = { version = "0.4", default-features = false }
