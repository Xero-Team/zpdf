[package]
name = "zpdf-viewer-gpui"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
gpui.workspace = true
zpdf = { workspace = true, features = ["gpu-render", "cpu-render"] }
zpdf-document.workspace = true
zpdf-writer.workspace = true
tracing.workspace = true
image.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
# `gpui` pulls `async-tar` -> `xattr 0.2.3`, which reads `libc::ENOATTR` on
# Linux. That constant was removed in libc 0.2.190, so pin the last release
# that still provides it until the `xattr`/`async-tar` chain is updated.
libc = "=0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform.workspace = true
