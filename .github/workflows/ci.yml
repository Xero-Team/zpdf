name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - name: Install software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: |
          # The runner has no GPU and, by default, no Vulkan ICD at all, so every
          # GPU test used to skip here — including the suites whose entire point is
          # a GPU↔CPU pixel comparison, which therefore compared nothing on Linux.
          # Mesa's lavapipe is a conformant CPU implementation of Vulkan; wgpu
          # enumerates it as an ordinary adapter (type Cpu, ranked last, so a real
          # GPU still wins wherever one exists).
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Build (all targets)
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: GPU oracle suites (software Vulkan)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo test -p zpdf --features gpu-render \
            --test gpu_acceptance --test gpu_overprint --test gpu_softmask \
            -- --nocapture 2>&1 | tee gpu-oracle.log
          # These suites skip when they cannot find an adapter — which is how this
          # step would "pass" while comparing nothing at all. Now that the driver
          # above is installed, a skip means it went missing again.
          if grep -q "skipping GPU" gpu-oracle.log; then
            echo "::error::a GPU oracle suite skipped — software Vulkan driver missing?"
            exit 1
          fi

  gpu-build:
    name: build (gpu-render feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile the wgpu backend through the facade feature flag (no GPU needed
      # to build — wgpu loads drivers at runtime, not link time).
      - run: cargo build -p zpdf --features gpu-render --verbose
