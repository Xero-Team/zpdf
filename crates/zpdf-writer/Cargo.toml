[package]
name = "zpdf-writer"
description = "Incremental PDF writer for appending annotations and modifications"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zpdf-font.workspace = true
zpdf-core.workspace = true
zpdf-parser.workspace = true
zpdf-document.workspace = true
# Content-stream tokenizer for redaction.
zpdf-content.workspace = true
thiserror.workspace = true
flate2.workspace = true
tracing.workspace = true
# TrueType/CFF parsing for font embedding in DocumentBuilder.
ttf-parser.workspace = true
# Pure-Rust signing (RustCrypto) for CMS/PKCS#7 signature creation:
# RSA PKCS#1 v1.5 and ECDSA P-256, SHA-256 digests.
# Keep signing on rsa 0.9's digest/AssociatedOid generation.
sha2 = { version = "0.10", features = ["oid"] }
rsa.workspace = true
p256 = { workspace = true, features = ["pkcs8"] }
# Encryption on save (Standard security handler, RC4 + AES-CBC).
aes.workspace = true
cbc = { workspace = true, features = ["alloc"] }
getrandom = "0.2"
# Optional RFC 3161 timestamp requester (pure-Rust HTTP via ureq + rustls).
ureq = { workspace = true, optional = true }

[features]
# Enables the built-in `UreqTimestampRequester` (pure-Rust HTTP to a TSA URL).
# Without it, the signing API still accepts a caller-supplied
# `TimestampRequester` — the library has no network dependency by default.
timestamp = ["dep:ureq"]

[dev-dependencies]
# Deterministic RSA keygen for the signing round-trip tests.
rand_chacha = "0.3"
